<!--
  ArknightsUID 模板公共头部（被所有 ark_*.html include）

  包含：字体加载策略 + 设计系统基座内联。
  - 中文 MiSans：jsdelivr CDN（加载失败回退系统黑体）
  - 拉丁/等宽：font_css_url 可配置（ArkConfig FontCssUrl）
  - ark_base.css 用 jinja include 内联，保证 set_content 渲染不依赖相对路径

  注意：本文件会被当作 jinja 模板解析，注释中禁止出现双花括号/百分号标签语法。
-->
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/misans@4.1.0/lib/Normal/MiSans-Regular.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/misans@4.1.0/lib/Normal/MiSans-Semibold.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/misans@4.1.0/lib/Normal/MiSans-Bold.min.css">
<link rel="stylesheet" href="{{ font_css_url }}">
<style>
    {% include "ark_base.css" %}
</style>
